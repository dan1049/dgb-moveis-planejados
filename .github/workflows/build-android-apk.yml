name: Build DGB Medidas Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dgb-medidas/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Verificar arquivos do app
        run: npm run web:check

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Gerar Android App Bundle de teste
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Disponibilizar APK e AAB para baixar
        uses: actions/upload-artifact@v4
        with:
          name: DGB-Medidas-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
